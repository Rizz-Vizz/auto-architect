zerops:
  - setup: api
    build:
      base: nodejs@22
      buildCommands:
        - cd backend && npm install --omit=dev
      cache: backend/node_modules
      deployFiles:
        - backend/~
    run:
      base: nodejs@22
      ports:
        - port: 8000
          httpSupport: true
      start: node server.js
      envVariables:
        GROQ_MODEL: llama-3.3-70b-versatile

  - setup: web
    build:
      base: static
      deployFiles:
        - frontend/~
    run:
      ports:
        - port: 80
          httpSupport: true
